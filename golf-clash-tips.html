        <h2>Reading Elevation</h2>
        <p>Downhill shots require POSITIVE elevation (+10% to +35%) because the ball stays airborne longer. Uphill shots require NEGATIVE elevation (-10% to -20%).</p>
        <h2>Negative Pullback</h2>
        <p>Pulling back target rings from max line controls downhill carry and prevents overshooting landing zones.</p>
        <h2>Scaling Rules</h2>
        <p>Wedges have low airtime so 20mph wind only requires ~2-3 rings at min, whereas low-accuracy Drivers require 10+ rings.</p>
